<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#023E28" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SetPoint" />
    <meta
      name="description"
      content="SetPoint is an offline tennis scorer for singles and doubles. Keep score on court — no account, data stays on this device."
    />
    <meta property="og:title" content="SetPoint — Offline tennis scorer" />
    <meta
      property="og:description"
      content="Singles and doubles scoring with pressure callouts, live stats, and voice. Install it. Play offline."
    />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,400..800;1,9..40,400..700&family=Fraunces:opsz,wght@9..144,400..700&family=Space+Grotesk:wght@400..700&family=Syne:wght@700;800&family=Syncopate:wght@700&family=Plus+Jakarta+Sans:wght@400..700&family=Share+Tech+Mono&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <title>SetPoint — Offline tennis scorer</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #023e28;
        color: #f4f7ef;
        font-family: 'DM Sans', system-ui, sans-serif;
      }

      /* Native-matching boot splash — outside #root so it shows before JS */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        margin: 0;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
        background: #023e28;
        transition: opacity 0.32s ease, visibility 0.32s ease;
      }

      #boot-splash.boot-splash--hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      #boot-splash img {
        width: min(220px, 42vw);
        height: auto;
        border-radius: 28px;
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.35);
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" role="status" aria-live="polite" aria-busy="true">
      <img
        src="/splash-icon.png"
        alt="SetPoint"
        width="220"
        height="220"
        decoding="async"
        fetchpriority="high"
      />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
